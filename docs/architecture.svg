<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Helvetica, Arial, sans-serif">
  <title>Wahlkarte – system architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6db3"/>
    </marker>
    <style>
      .zone { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .zl { font-size: 13px; font-weight: 700; fill: #666; letter-spacing: 0.08em; }
      .box { stroke: #333; stroke-width: 1.2; rx: 6; }
      .src { fill: #fbeee0; }
      .py { fill: #e6f0e1; }
      .dat { fill: #fff7d1; }
      .fe { fill: #e3ecf8; }
      .gh { fill: #ececec; }
      .usr { fill: #f3e6f1; }
      .h { font-size: 15px; font-weight: 700; fill: #111; }
      .t { font-size: 12px; fill: #222; }
      .m { font-size: 11px; fill: #555; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #222; }
      .flow { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .deploy { stroke: #2f6db3; stroke-width: 1.8; fill: none; marker-end: url(#arrB); }
      .lbl { font-size: 11px; fill: #333; }
      .lblB { font-size: 11px; fill: #2f6db3; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#111">Wahlkarte · system architecture</text>
  <text x="20" y="54" class="m">Black arrows = data flow · blue arrows = build &amp; deploy flow</text>

  <!-- ===== external: official sources ===== -->
  <rect x="20" y="72" width="690" height="112" class="box src"/>
  <text x="34" y="94" class="h">Official sources · Die Bundeswahlleiterin (bundeswahlleiterin.de)</text>
  <text x="34" y="116" class="mono">kerg2.csv</text>
  <text x="236" y="116" class="t">final result BTW 2025 (Wahlkreis / Land / Bund)</text>
  <text x="34" y="136" class="mono">btw2025_strukturdaten.csv</text>
  <text x="236" y="136" class="t">population and area per Wahlkreis</text>
  <text x="34" y="156" class="mono">…wahlkreise_shp_geo.zip</text>
  <text x="236" y="156" class="t">constituency boundaries (GeoBasis-DE / BKG)</text>
  <text x="34" y="175" class="m">Licence: dl-de/by-2-0 · status "Endgültig", 14.03.2025</text>

  <!-- ===== LOCAL zone ===== -->
  <rect x="10" y="206" width="720" height="636" class="zone" rx="10"/>
  <text x="150" y="228" class="zl">LOCAL · YOUR MAC (run once / on data refresh)</text>

  <!-- pipeline -->
  <rect x="24" y="242" width="692" height="196" class="box py"/>
  <text x="38" y="264" class="h">Python data pipeline (scripts/, .venv)</text>
  <rect x="38" y="276" width="150" height="148" rx="5" fill="#fff" stroke="#6a8f5a"/>
  <text x="48" y="296" class="mono" font-weight="700">fetch_sources.py</text>
  <text x="48" y="316" class="t">urllib download</text>
  <text x="48" y="334" class="t">SHA-256 hashes</text>
  <text x="48" y="352" class="t">→ sources.json</text>

  <rect x="206" y="276" width="160" height="148" rx="5" fill="#fff" stroke="#6a8f5a"/>
  <text x="216" y="296" class="mono" font-weight="700">build_data.py</text>
  <text x="216" y="316" class="t">pandas · geopandas</text>
  <text x="216" y="334" class="t">results.json</text>
  <text x="216" y="352" class="t">validation checks:</text>
  <text x="216" y="368" class="m">Σ WK = Σ Land = Bund</text>
  <text x="216" y="382" class="m">299 WK ↔ geometries</text>
  <text x="216" y="396" class="m">turnout 82.5 %, 23 no-seat</text>
  <text x="216" y="412" class="m">fails build on mismatch</text>

  <rect x="384" y="276" width="140" height="148" rx="5" fill="#fff" stroke="#6a8f5a"/>
  <text x="394" y="296" class="mono" font-weight="700">mapshaper</text>
  <text x="394" y="316" class="t">simplify 10 %</text>
  <text x="394" y="334" class="t">dissolve → Länder</text>
  <text x="394" y="352" class="t">→ TopoJSON</text>

  <rect x="542" y="276" width="160" height="148" rx="5" fill="#fff" stroke="#6a8f5a"/>
  <text x="552" y="296" class="mono" font-weight="700">build_layouts.py</text>
  <text x="552" y="316" class="t">scipy · numpy</text>
  <text x="552" y="334" class="t">collision relaxation</text>
  <text x="552" y="352" class="t">Hungarian assignment</text>
  <text x="552" y="370" class="t">→ hex grid</text>
  <text x="552" y="388" class="t">Dorling circles</text>
  <text x="552" y="406" class="m">Land contiguity repair</text>

  <path d="M188,350 L204,350" class="flow"/>
  <path d="M366,350 L382,350" class="flow"/>
  <path d="M524,350 L540,350" class="flow"/>

  <!-- data files -->
  <rect x="24" y="470" width="692" height="70" class="box dat"/>
  <text x="38" y="492" class="h">Static data · public/data/ (committed to git)</text>
  <text x="38" y="516" class="mono">results.json   geo.topo.json   layout_hex.json   layout_circles.json   sources.json</text>
  <text x="38" y="532" class="m">≈ 0.5 MB in total · no runtime calls to official servers</text>

  <!-- frontend -->
  <rect x="24" y="572" width="692" height="250" class="box fe"/>
  <text x="38" y="594" class="h">Frontend · Vite + TypeScript (src/)</text>
  <rect x="38" y="606" width="200" height="96" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="48" y="626" class="mono" font-weight="700">main.ts · state.ts</text>
  <text x="48" y="644" class="t">app shell, URL-hash state</text>
  <text x="48" y="662" class="mono" font-weight="700">data.ts · parties.ts</text>
  <text x="48" y="680" class="t">loading, CDU/CSU colours</text>
  <text x="48" y="696" class="mono" font-weight="700">i18n.ts</text><text x="104" y="696" class="t">DE / EN</text>

  <rect x="252" y="606" width="210" height="96" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="262" y="626" class="t" font-weight="700">D3 · SVG views</text>
  <text x="262" y="646" class="mono">geo.ts</text><text x="340" y="646" class="m">map (WK / Land)</text>
  <text x="262" y="664" class="mono">hex.ts</text><text x="340" y="664" class="m">hex cartogram</text>
  <text x="262" y="682" class="mono">circles.ts</text><text x="340" y="682" class="m">Dorling</text>
  <text x="262" y="698" class="mono">spikes.ts</text><text x="340" y="698" class="m">votes 2D</text>

  <rect x="476" y="606" width="226" height="96" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="486" y="626" class="t" font-weight="700">deck.gl · WebGL (lazy-loaded)</text>
  <text x="486" y="646" class="mono">relief.ts</text><text x="556" y="646" class="m">votes 3D</text>
  <text x="486" y="664" class="m">ColumnLayer (columns)</text>
  <text x="486" y="682" class="m">GeoJsonLayer extruded (areas)</text>
  <text x="486" y="698" class="m">no basemap · no API key</text>

  <rect x="38" y="716" width="664" height="34" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="48" y="738" class="mono" font-weight="700">components/panels.ts</text>
  <text x="210" y="738" class="t">controls · legend · details panel · national bar · sources dialog</text>

  <rect x="38" y="762" width="320" height="46" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="48" y="782" class="t" font-weight="700">Vite dev server</text>
  <text x="48" y="798" class="mono">npm run dev → http://localhost:5173</text>
  <rect x="372" y="762" width="330" height="46" rx="5" fill="#fff" stroke="#5578a8"/>
  <text x="382" y="782" class="t" font-weight="700">git</text>
  <text x="382" y="798" class="mono">commit → git push origin main</text>

  <!-- local flows -->
  <path d="M120,184 L120,274" class="flow"/>
  <text x="128" y="200" class="lbl">HTTPS download</text>
  <path d="M370,438 L370,468" class="flow"/>
  <path d="M370,540 L370,570" class="flow"/>
  <text x="378" y="560" class="lbl">fetch() at runtime</text>

  <!-- ===== CLOUD zone ===== -->
  <rect x="756" y="206" width="430" height="636" class="zone" rx="10"/>
  <text x="770" y="228" class="zl">CLOUD · GITHUB</text>

  <rect x="772" y="250" width="398" height="86" class="box gh"/>
  <text x="786" y="272" class="h">GitHub repository</text>
  <text x="786" y="294" class="mono">&lt;your-user&gt;/wahlkarte · branch main</text>
  <text x="786" y="314" class="t">source, scripts, committed data, docs</text>

  <rect x="772" y="372" width="398" height="118" class="box gh"/>
  <text x="786" y="394" class="h">GitHub Actions</text>
  <text x="786" y="414" class="mono">.github/workflows/deploy.yml</text>
  <text x="786" y="436" class="t">on push: npm ci → tsc → vite build</text>
  <text x="786" y="456" class="t">upload-pages-artifact (dist/)</text>
  <text x="786" y="476" class="t">deploy-pages</text>

  <rect x="772" y="526" width="398" height="96" class="box gh"/>
  <text x="786" y="548" class="h">GitHub Pages (static hosting)</text>
  <text x="786" y="570" class="mono">https://&lt;your-user&gt;.github.io/wahlkarte/</text>
  <text x="786" y="592" class="t">HTML · JS · CSS · JSON over HTTPS</text>
  <text x="786" y="610" class="m">no backend, no database</text>

  <rect x="772" y="668" width="398" height="140" class="box usr"/>
  <text x="786" y="690" class="h">Visitor's browser</text>
  <text x="786" y="712" class="t">runs the whole app client-side</text>
  <text x="786" y="732" class="t">SVG rendering (D3) · WebGL (deck.gl)</text>
  <text x="786" y="752" class="t">state in URL → shareable links</text>
  <text x="786" y="772" class="t">no cookies, no tracking, no external fonts</text>
  <text x="786" y="792" class="m">theme choice kept in localStorage</text>

  <!-- deploy flow -->
  <path d="M702,785 C740,785 730,293 770,293" class="deploy"/>
  <text x="712" y="560" class="lblB" transform="rotate(-90 712 560)">git push</text>
  <path d="M971,336 L971,370" class="deploy"/>
  <path d="M971,490 L971,524" class="deploy"/>
  <path d="M971,622 L971,666" class="flow"/>
  <text x="980" y="650" class="lbl">HTTPS GET</text>
  
</svg>
